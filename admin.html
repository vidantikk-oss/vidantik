<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administration des avis | Vid'Antik</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root {
  --cream: #f7f2df; --paper: #fffcf0; --green: #2d5a3a; --green-deep: #1f4029; --ochre: #d98e2b;
  --ink: #2c2a24; --muted: #5e5a4c; --line: #d9d0b2; --red: #9b2c1c;
  --f-display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f-body); font-size: 1.1rem; line-height: 1.55; }
h1, h2 { font-family: var(--f-display); color: var(--green); margin: 0; line-height: 1.15; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.topbar { background: var(--green-deep); color: var(--paper); padding: 12px max(16px, env(safe-area-inset-left, 0px)); }
.topbar .in { max-width: 820px; margin-inline: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; letter-spacing: .03em; text-decoration: none; color: inherit; }
.topbar a.lien { color: inherit; opacity: .88; font-size: 1rem; }
main { max-width: 820px; margin-inline: auto; padding: clamp(24px, 5vw, 56px) 16px 64px; display: grid; gap: 28px; }
.panel { background: var(--paper); border: 1px solid var(--line); padding: clamp(20px, 4vw, 32px); display: grid; gap: 14px; }
.login { max-width: 440px; margin-inline: auto; width: 100%; }
input[type="password"] { width: 100%; font: inherit; padding: 12px; background: var(--cream); border: 1px solid var(--line); border-radius: 0; }
input:focus { border-color: var(--green); outline: none; }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 1rem; padding: 11px 18px; border: 2px solid var(--green); background: var(--green); color: var(--paper); cursor: pointer; }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.line { background: transparent; color: var(--green); }
.btn.red { background: var(--red); border-color: var(--red); }
.msg { color: var(--red); font-size: 1rem; min-height: 1.4em; }
.tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.compte { font-family: var(--f-display); background: var(--ochre); color: #fff; padding: 1px 10px; font-size: .95rem; margin-left: 8px; }
.liste { display: grid; gap: 14px; }
.avis { background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--ochre); padding: 18px 20px; display: grid; gap: 10px; }
.avis.pub { border-left-color: var(--green); }
.stars { color: var(--ochre); font-size: 1.25rem; letter-spacing: .1em; }
.avis blockquote { margin: 0; font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .95rem; }
.meta b { color: var(--green); font-family: var(--f-display); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.vide { color: var(--muted); font-style: italic; }
.note { color: var(--muted); font-size: .95rem; }

/* Fondus de vert sur les grandes zones vertes (boutons et textes restent en vert uni) */
.topbar { background: linear-gradient(100deg, #1b3826 0%, #24482f 30%, #2f5e3d 62%, #1f4029 100%) !important; }
.sim-promo, .green-band, .footer {
  background:
    radial-gradient(ellipse 55% 80% at 82% 15%, rgba(74, 128, 92, .45), transparent 70%),
    radial-gradient(ellipse 50% 70% at 0% 100%, rgba(10, 30, 18, .5), transparent 70%),
    linear-gradient(150deg, #2f5e3d 0%, #24482f 50%, #1b3826 100%) !important; }
.callbar { background: linear-gradient(90deg, #1b3826 0%, #2a5537 50%, #1b3826 100%) !important; }
.chat-head { background: linear-gradient(100deg, #1b3826 0%, #2b5638 100%) !important; }
</style>
</head>
<body>
<header class="topbar"><div class="in"><a class="logo" href="./">VID'ANTIK</a><span><a class="lien" href="./#avis">Voir les avis sur le site</a></span></div></header>

<main>
  <section class="panel login" id="connexion">
    <h1>Espace administrateur</h1>
    <p class="note">Validation des avis clients.</p>
    <form id="form-code">
      <label for="code" style="display:block;font-weight:600;margin-bottom:6px">Code administrateur</label>
      <input type="password" id="code" autocomplete="current-password" required>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn" type="submit" id="entrer">Entrer</button>
    </form>
  </section>

  <div id="zone" hidden>
    <div class="tete" style="margin-bottom:14px">
      <h1>Avis clients</h1>
      <span><button class="btn line" id="actualiser" type="button">Actualiser</button> <button class="btn line" id="sortir" type="button">Se déconnecter</button></span>
    </div>
    <div style="display:grid;gap:36px">
      <section>
        <h2 style="margin-bottom:12px">En attente de validation <span class="compte" id="n-attente">0</span></h2>
        <div class="liste" id="attente"></div>
      </section>
      <section>
        <h2 style="margin-bottom:12px">Publiés sur le site <span class="compte" id="n-publies" style="background:var(--green)">0</span></h2>
        <div class="liste" id="publies"></div>
      </section>
    </div>
  </div>
</main>

<script>
(function () {
  var API = 'https://vidantik-avis.vidantikk.workers.dev';
  var code = '';
  try { code = localStorage.getItem('vidantik-admin') || ''; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var el = function (t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

  var appel = function (chemin, data) {
    return fetch(API + chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { j.status = r.status; return j; }); });
  };

  var carte = function (a, publie) {
    var d = el('article', 'avis' + (publie ? ' pub' : ''));
    var n = Math.max(1, Math.min(5, a.note || 5));
    d.appendChild(el('div', 'stars', '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n)));
    d.appendChild(el('blockquote', '', '« ' + a.texte + ' »'));
    var m = el('div', 'meta'); m.appendChild(el('b', '', a.nom));
    m.appendChild(document.createTextNode([a.commune, a.prestation, a.date].filter(Boolean).map(function (x) { return ' · ' + x; }).join('')));
    d.appendChild(m);
    var act = el('div', 'actions');
    var bouton = function (txt, cls, action, question) {
      var b = el('button', 'btn ' + cls, txt); b.type = 'button';
      b.onclick = function () {
        if (question && !confirm(question)) return;
        act.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        appel('/admin/action', { code: code, id: a.id, action: action }).then(charger, charger);
      };
      act.appendChild(b);
    };
    if (publie) bouton('Retirer du site', 'line', 'retirer');
    else { bouton('Publier sur le site', '', 'publier'); bouton('Supprimer', 'red', 'supprimer', 'Supprimer définitivement cet avis ?'); }
    d.appendChild(act);
    return d;
  };

  var remplir = function (zone, liste, publie, vide) {
    zone.textContent = '';
    if (!liste.length) zone.appendChild(el('p', 'vide', vide));
    liste.forEach(function (a) { zone.appendChild(carte(a, publie)); });
  };

  var charger = function () {
    $('entrer').disabled = true;
    return appel('/admin/liste', { code: code }).then(function (d) {
      $('entrer').disabled = false;
      if (!d.ok) {
        $('msg').textContent = d.status === 429 ? 'Trop d\'essais. Réessayez dans une heure.' : 'Code incorrect.';
        try { localStorage.removeItem('vidantik-admin'); } catch (e) {}
        $('zone').hidden = true; $('connexion').hidden = false; return;
      }
      try { localStorage.setItem('vidantik-admin', code); } catch (e) {}
      $('msg').textContent = ''; $('connexion').hidden = true; $('zone').hidden = false;
      $('n-attente').textContent = d.attente.length; $('n-publies').textContent = d.publies.length;
      remplir($('attente'), d.attente, false, 'Aucun nouvel avis pour l\'instant.');
      remplir($('publies'), d.publies, true, 'Aucun avis publié pour l\'instant.');
      document.title = (d.attente.length ? '(' + d.attente.length + ') ' : '') + 'Administration des avis | Vid\'Antik';
    }).catch(function () {
      $('entrer').disabled = false;
      $('msg').textContent = 'Connexion impossible. Vérifiez votre connexion internet.';
    });
  };

  $('form-code').addEventListener('submit', function (e) { e.preventDefault(); code = $('code').value.trim(); if (code) charger(); });
  $('actualiser').onclick = charger;
  $('sortir').onclick = function () { try { localStorage.removeItem('vidantik-admin'); } catch (e) {} code = ''; $('code').value = ''; $('zone').hidden = true; $('connexion').hidden = false; };
  if (code) charger();
})();
</script>
</body>
</html>
